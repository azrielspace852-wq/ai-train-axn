[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aittrain-sdk"
version = "1.0.0"
description = "Python SDK untuk platform AITTrain agnostic AI training runner"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AITTrain" }]
dependencies = [
    "requests>=2.31.0",
    "typing-extensions>=4.7; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
aittrain = "aittrain.cli:main"

[tool.setuptools.packages.find]
include = ["aittrain*"]
