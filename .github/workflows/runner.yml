name: AITTrain 24/7 Runner

# Trigger: manual + otomatis oleh runner.py saat handoff (workflow_dispatch)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/runner.yml"

# Concurrency di-disable sengaja: kita BUTUH dua job berjalan bersamaan
# saat overlap handoff (multi-connector Cloudflare Tunnel).
# JANGAN tambahkan concurrency.group di sini.

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # batas keras GitHub = 6 jam; handoff di ~5h40m
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Install cloudflared
        run: |
          # Download binary cloudflared langsung (tanpa package manager)
          curl -sL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Prepare workspace
        run: |
          sudo mkdir -p /workspace
          sudo chown $USER /workspace

      - name: Run AITTrain runner (server + tunnel + handoff watchdog)
        env:
          # --- Semua secret dibaca dari GitHub Secrets, TIDAK PERNAH di-print ---
          GH_PAT: ${{ secrets.GH_PAT }}
          CERT_PEM: ${{ secrets.CERT_PEM }}
          UUID_TUNNEL: ${{ secrets.UUID_TUNNEL }}
          UUID_JSON: ${{ secrets.UUID_JSON }}
          CONFIG_YML: ${{ secrets.CONFIG_YML }}
          AITTRAIN_API_KEY: ${{ secrets.AITTRAIN_API_KEY }}
          # --- Konfigurasi opsional ---
          AITTRAIN_WORKSPACE: /workspace
          AITTRAIN_PORT: "8000"
          AITTRAIN_MAX_JOBS: "1"
          AITTRAIN_HANDOFF_AT: "20400" # 5 jam 40 menit (detik)
          AITTRAIN_OVERLAP: "240"      # 4 menit overlap connector
          AITTRAIN_DRAIN_TIMEOUT: "900"
        run: |
          # Pastikan secret tidak pernah bocor ke log
          set +x
          python server/runner.py
