<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AITTrain — Browser SDK Demo</title>
<!--
  Demo ini memakai bundle IIFE minified (global `AITTrain`).
  Path relatif: dari examples/browser/ ke dist/aittrain.min.js.
  Buka file ini langsung di browser (file://) — server sudah mengaktifkan CORS.
-->
<script src="../../dist/aittrain.min.js"></script>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#34d399; --err:#f87171; --border:#334155; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); padding:24px; line-height:1.5; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:14px; margin:0 0 12px; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=password], textarea { width:100%; padding:8px 10px; background:#0b1220; border:1px solid var(--border); border-radius:6px; color:var(--fg); font-size:13px; font-family:inherit; margin-bottom:10px; }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; min-height:60px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  button { background:var(--accent); color:#082f49; border:none; padding:8px 14px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; margin-right:8px; margin-bottom:4px; }
  button.secondary { background:#334155; color:var(--fg); }
  button.danger { background:var(--err); color:#450a0a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  pre#logs { background:#020617; border:1px solid var(--border); border-radius:6px; padding:12px; font-size:12px; height:320px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .badge.queued { background:#475569; }
  .badge.running { background:#0369a1; }
  .badge.completed { background:#065f46; }
  .badge.failed, .badge.cancelled { background:#7f1d1d; }
  .msg { font-size:12px; margin-top:8px; }
  .msg.ok { color:var(--ok); } .msg.err { color:var(--err); } .msg.muted { color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; }
  code { background:#0b1220; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>

<h1>AITTrain — Browser SDK Demo</h1>
<div class="sub">Submit training job, pantau log real-time, unduh artefak — semua langsung dari browser (tanpa Node.js / tanpa server).</div>

<div class="panel">
  <h2>1. Koneksi</h2>
  <div class="row">
    <div><label>Base URL</label><input type="text" id="baseUrl" value="https://ai.train.axn.cc.cd" /></div>
    <div><label>API Key</label><input type="password" id="apiKey" placeholder="AITTRAIN_API_KEY" /></div>
  </div>
  <button class="secondary" onclick="checkHealth()">Health Check</button>
  <span id="healthMsg" class="msg muted">belum dicek</span>
</div>

<div class="panel">
  <h2>2. Submit Job</h2>
  <div class="row">
    <div><label>Entrypoint (nama file utama, mis. train.py)</label><input type="text" id="entrypoint" value="train.py" /></div>
    <div><label>Env vars (JSON, opsional)</label><textarea id="envJson">{"BATCH_SIZE":"32","EPOCHS":"5"}</textarea></div>
  </div>
  <label>File training (kode, config, dataset — pilih banyak)</label>
  <input type="file" id="files" multiple style="margin-bottom:10px;" />
  <button onclick="submitJob()">Submit Job</button>
  <span id="submitMsg" class="msg muted"></span>
</div>

<div class="panel">
  <h2>3. Job Aktif</h2>
  <div>Job ID: <code id="jobId">-</code> &nbsp; Status: <span id="statusBadge" class="badge">-</span> &nbsp; <span id="statusDetail" class="msg muted"></span></div>
  <div style="margin-top:10px;">
    <button class="secondary" onclick="refreshStatus()">Refresh Status</button>
    <button class="secondary" onclick="streamLogs()">Stream Log (real-time)</button>
    <button class="secondary" onclick="listJobs()">List Jobs</button>
    <button class="danger" onclick="cancelJob()">Cancel Job</button>
  </div>
  <pre id="logs"><!-- log muncul di sini --></pre>
</div>

<div class="panel">
  <h2>4. Unduh Artefak</h2>
  <button id="downloadBtn" disabled onclick="downloadArtifact()">Download .zip (tunggu sampai artefak siap)</button>
  <span id="downloadMsg" class="msg muted"></span>
</div>

<div class="panel">
  <h2>Jobs Terbaru</h2>
  <div id="jobsList" class="msg muted">klik "List Jobs" untuk memuat.</div>
</div>

<script>
let client = null;
let currentJobId = null;
let streaming = false;

function getClient() {
  if (client) return client;
  const apiKey = document.getElementById("apiKey").value.trim();
  const baseUrl = document.getElementById("baseUrl").value.trim();
  if (!apiKey) { alert("API Key wajib diisi."); throw new Error("no api key"); }
  // AITTrain adalah global dari bundle IIFE (dist/aittrain.min.js)
  client = new AITTrain.AITTrainClient({ apiKey, baseUrl });
  return client;
}

function setMsg(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "msg " + (cls || "muted");
}

function setStatusBadge(status) {
  const el = document.getElementById("statusBadge");
  el.textContent = status || "-";
  el.className = "badge " + (status || "");
}

async function checkHealth() {
  try {
    const c = getClient();
    const h = await c.health();
    setMsg("healthMsg", `ok — draining=${h.draining}, queued=${h.queued}`, "ok");
  } catch (e) { setMsg("healthMsg", "gagal: " + e.message, "err"); }
}

async function submitJob() {
  try {
    const c = getClient();
    const entrypoint = document.getElementById("entrypoint").value.trim() || "train.py";
    const fileInput = document.getElementById("files");
    const files = Array.from(fileInput.files); // File objects — diterima langsung SDK
    if (files.length === 0) { alert("Pilih minimal satu file training."); return; }
    let env = {};
    try { env = JSON.parse(document.getElementById("envJson").value || "{}"); }
    catch { alert("Env JSON tidak valid."); return; }

    setMsg("submitMsg", "mengupload...", "muted");
    const res = await c.submitJob({ entrypoint, files, env });
    currentJobId = res.job_id;
    document.getElementById("jobId").textContent = currentJobId;
    setStatusBadge(res.status);
    setMsg("submitMsg", `job ${currentJobId} submitted`, "ok");
    document.getElementById("logs").textContent = "";
    document.getElementById("downloadBtn").disabled = true;
  } catch (e) { setMsg("submitMsg", "gagal: " + e.message, "err"); }
}

async function refreshStatus() {
  if (!currentJobId) { setMsg("statusDetail", "belum ada job", "err"); return; }
  try {
    const c = getClient();
    const st = await c.getStatus(currentJobId);
    setStatusBadge(st.status);
    document.getElementById("statusDetail").textContent =
      `exit_code=${st.exit_code} artifact_ready=${st.artifact_ready} queue_pos=${st.queue_position ?? "-"}`;
    if (st.artifact_ready) document.getElementById("downloadBtn").disabled = false;
    if (st.error) document.getElementById("statusDetail").textContent += " | error: " + st.error;
  } catch (e) { document.getElementById("statusDetail").textContent = e.message; }
}

async function streamLogs() {
  if (!currentJobId) { alert("Submit job dulu."); return; }
  if (streaming) { alert("Sedang streaming."); return; }
  streaming = true;
  const pre = document.getElementById("logs");
  pre.textContent = "";
  const c = getClient();
  try {
    const final = await c.streamLogs(currentJobId, {
      onLine: (line) => {
        pre.textContent += line;
        pre.scrollTop = pre.scrollHeight;
      },
    });
    setStatusBadge(final.status);
    setMsg("downloadMsg", `selesai: ${final.status}`, final.status === "completed" ? "ok" : "err");
    if (final.artifact_ready) document.getElementById("downloadBtn").disabled = false;
  } catch (e) {
    pre.textContent += "\n[stream error] " + e.message;
  } finally {
    streaming = false;
  }
}

async function cancelJob() {
  if (!currentJobId) { alert("Belum ada job."); return; }
  if (!confirm("Batalkan job " + currentJobId + "?")) return;
  try {
    const c = getClient();
    const res = await c.cancelJob(currentJobId);
    setMsg("statusDetail", JSON.stringify(res), "muted");
    refreshStatus();
  } catch (e) { alert(e.message); }
}

async function downloadArtifact() {
  if (!currentJobId) return;
  const btn = document.getElementById("downloadBtn");
  btn.disabled = true;
  setMsg("downloadMsg", "mengunduh (menunggu artefak siap)...", "muted");
  try {
    const c = getClient();
    // AITTrain.saveBlob — helper dari bundle browser untuk trigger download
    const blob = await c.downloadAndWait(currentJobId);
    AITTrain.saveBlob(blob, currentJobId + ".zip");
    setMsg("downloadMsg", "unduhan dimulai: " + currentJobId + ".zip", "ok");
  } catch (e) { setMsg("downloadMsg", "gagal: " + e.message, "err"); }
  btn.disabled = false;
}

async function listJobs() {
  try {
    const c = getClient();
    const { jobs } = await c.listJobs({ limit: 20 });
    const div = document.getElementById("jobsList");
    if (jobs.length === 0) { div.textContent = "tidak ada job."; return; }
    let html = "<table><tr><th>job_id</th><th>status</th><th>entrypoint</th><th>artifact</th><th></th></tr>";
    for (const j of jobs) {
      html += `<tr><td><code>${j.job_id}</code></td><td>${j.status}</td><td>${j.entrypoint}</td>` +
              `<td>${j.artifact_ready ? "siap" : "-"}</td>` +
              `<td><button class="secondary" onclick="loadJob('${j.job_id}')">pilih</button></td></tr>`;
    }
    html += "</table>";
    div.innerHTML = html;
  } catch (e) { document.getElementById("jobsList").textContent = "gagal: " + e.message; }
}

function loadJob(id) {
  currentJobId = id;
  document.getElementById("jobId").textContent = id;
  document.getElementById("logs").textContent = "";
  refreshStatus();
}
</script>
</body>
</html>
